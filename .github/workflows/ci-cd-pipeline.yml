name: RaceDay System CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =======================================================
  # JOB 1: Build & Validate Database Schema
  # =======================================================
  database-and-build:
    name: Build & Validate Database Schema
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: "YourStrong@Password123"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Wait for SQL Server Container
        run: |
          echo "Waiting for SQL Server to initialize..."
          for i in {1..30}; do
            docker exec ${{ job.services.mssql.id }} /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1' && break || sleep 2
          done

      - name: Install SQLCMD Client Utility
        run: |
          sudo apt-get update
          sudo apt-get install -y mssql-tools unixodbc-dev
          echo '/opt/mssql-tools/bin' >> $GITHUB_PATH

      - name: Test SQL Script Execution (part1_poe.sql)
        run: |
          echo "Executing Database Initialization Script..."
          /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P 'YourStrong@Password123' -i part1_poe.sql

  # =======================================================
  # JOB 2: Run API Route Integration & Unit Tests
  # =======================================================
  api-testing:
    name: Run API Endpoint Tests
    needs: database-and-build
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: "YourStrong@Password123"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check package.json & Install Dependencies
        run: |
          if [ -f package.json ]; then
            echo "package.json found. Installing dependencies..."
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          else
            echo "No package.json found in repository root. Skipping npm install."
          fi

      - name: Run Test Suite
        env:
          DB_SERVER: localhost
          DB_NAME: part1_poe
          DB_USER: sa
          DB_PASSWORD: "YourStrong@Password123"
          JWT_SECRET: "ci_cd_test_secret_key"
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          else
            echo "No package.json present. Skipping automated API tests."
          fi

  # =======================================================
  # JOB 3: Deployment
  # =======================================================
  deploy:
    name: Deploy Application
    needs: api-testing
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Step
        run: |
          echo "🚀 Database validation and build checks completed successfully!"
